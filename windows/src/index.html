<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>拼音 Sing</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island" data-tauri-drag-region>
    <div id="stage"></div>
    <div id="message"></div>
    <div class="controls top-left">
      <button class="icon bubble" id="like" title="Like"></button>
      <button class="icon bubble" id="add" title="Add to album"></button>
    </div>
    <div class="controls top-right">
      <button class="icon bubble" id="pin" title="Keep on top"></button>
      <button class="icon bubble" id="dash" title="Open the dashboard"></button>
      <button class="icon bubble" id="gear" title="Island settings"></button>
      <button class="icon bubble" id="hide" title="Hide (bring back from the tray)"></button>
    </div>
    <div class="controls bottom">
      <div id="seek" class="bubble"></div>
      <div class="transport">
        <button class="icon bubble" id="prev" title="Previous"></button>
        <button class="icon big bubble" id="play" title="Play / pause"></button>
        <button class="icon bubble" id="next" title="Next"></button>
      </div>
    </div>
    <div id="settings" class="hidden">
      <div class="row col"><span>汽水音乐 share link for this song</span>
        <div class="link"><input id="qs-link" placeholder="Paste the link from Share → Copy Link"><button id="qs-go">Get lyrics</button></div>
        <small id="qs-msg"></small></div>
      <div class="row col"><span>Paste lyrics (LRC with times, or plain text)</span>
        <textarea id="paste" rows="4" style="border-radius:10px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.15);padding:8px"></textarea>
        <div class="link"><span></span><button id="paste-go">Save lyrics</button></div></div>
      <small>Colors, size and more are in the dashboard → Customization.</small>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
