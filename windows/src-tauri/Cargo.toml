[package]
name = "pinyin-sing"
version = "0.1.0"
description = "拼音 Sing for Windows: floating lyrics with pinyin under every line"
license = "MIT"
edition = "2021"

[lib]
name = "pinyin_sing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections"] }
windows-future = "0.3"

[profile.release]
strip = true
lto = true
opt-level = "s"
