# Builds the Windows app on GitHub's Windows machines and keeps the installer as a download.
# Runs when anything in windows/ changes, or by hand from the Actions tab.
# Tags like "windows-v0.1.0" also publish the installer as a GitHub release.
name: Windows build

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      - name: Shared logic tests
        run: node --experimental-strip-types --test src/core/core.test.ts
      - name: Build the installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: PinyinSing-windows
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish a release for windows-v* tags
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/src-tauri/target/release/bundle/nsis/*.exe
          name: 拼音 Sing for Windows ${{ github.ref_name }}
          body: |
            The Windows version of 拼音 Sing (early, smaller than the Mac app).
            Download the .exe below and run it. Windows may say it protected your PC because the app isn't signed: click More info → Run anyway.
